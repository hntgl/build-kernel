name: Build Xiaomi Mondrian Kernel

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core bc bison flex build-essential \
            libssl-dev libelf-dev libdw-dev lz4 cpio zip python3 curl \
            ccache dwarves gcc-aarch64-linux-gnu

      - name: Clone kernel sources (Kernel + Modules + Devicetrees)
        run: |
          # Clone Kernel
          git clone --depth=1 https://github.com/LineageOS/android_kernel_xiaomi_sm8450 -b lineage-23.2 kernel
          # Clone Modules vào đúng vị trí
          git clone --depth=1 https://github.com/LineageOS/android_kernel_xiaomi_sm8450-modules -b lineage-23.2 kernel/modules
          # Clone Devicetrees vào đúng vị trí
          git clone --depth=1 https://github.com/LineageOS/android_kernel_xiaomi_sm8450-devicetrees -b lineage-23.2 kernel/arch/arm64/boot/dts/vendor

      - name: Download Clang Toolchain (AOSP Clang r536225)
        run: |
          git clone --depth=1 https://gitlab.com/reagans-clang/clang-r536225 clang

      - name: Build kernel Image + dtbo
        run: |
          cd kernel
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-

          # 1. Tạo gki_defconfig nền
          make O=out ARCH=arm64 LLVM=1 gki_defconfig

          # 2. Gộp cấu hình vendor Waipio + Mondrian
          ./scripts/kconfig/merge_config.sh -O out out/.config \
            arch/arm64/configs/vendor/waipio_GKI.config \
            arch/arm64/configs/vendor/xiaomi_GKI.config \
            arch/arm64/configs/vendor/mondrian_GKI.config \
            arch/arm64/configs/vendor/debugfs.config

          # 3. Tiến hành biên dịch
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 -j$(nproc --all)

      - name: Package output
        run: |
          mkdir release
          # Copy file Image / Image.gz
          if [ -f kernel/out/arch/arm64/boot/Image ]; then
            cp kernel/out/arch/arm64/boot/Image release/
          fi
          if [ -f kernel/out/arch/arm64/boot/Image.gz ]; then
            cp kernel/out/arch/arm64/boot/Image.gz release/
          fi
          
          # Tìm và copy tất cả file dtb/dtbo
          find kernel/out -name "*.dtb" -o -name "*.dtbo" -exec cp {} release/ \;

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mondrian-kernel-image
          path: release/*
